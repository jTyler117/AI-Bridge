name: release

# Push a tag like v0.9.0 and this builds the Windows installer and attaches it to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: cmd
        run: packaging\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/AI-Bridge-Setup-*.exe
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/AI-Bridge-Setup-*.exe
