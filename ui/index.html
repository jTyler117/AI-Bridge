<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Bridge</title>
<style>
:root{--bg:#0e1015;--panel:#161922;--panel2:#1d2131;--line:#262b3a;--text:#e7e9f0;--muted:#8a92a8;
  --claude:#e08a62;--gpt:#3fb68b;--human:#6c8cff;--accent:#5b72e0;--warn:#f3b34c;--bad:#ef5b5b;--good:#46c28a;--r:12px;
  --code:#0b0d12;--input:#10131b;--bar:#12151d;--raised:#1f2536;--oncolor:#10131b;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.row{flex-wrap:nowrap;align-items:flex-start} label.row>input[type=checkbox]{flex:none;margin-top:3px}
.grow{flex:1}

/* header */
header{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.2px;font-size:15px}
.logo i{font-style:normal;color:var(--claude)} .logo u{text-decoration:none;color:var(--gpt)}
.badge{background:color-mix(in srgb,var(--warn) 22%,var(--panel));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 38%,var(--panel));border-radius:999px;padding:0 8px;font-size:11px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.running .dot{background:var(--good);box-shadow:0 0 0 0 rgba(70,194,138,.6);animation:pulse 1.6s infinite}
.pill.paused .dot{background:var(--warn)} .pill.error .dot{background:var(--bad)} .pill.finished .dot{background:var(--human)}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(70,194,138,0)}100%{box-shadow:0 0 0 0 rgba(70,194,138,0)}}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 12px}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))} .btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent,#fff);font-weight:600}.btn.primary:hover{filter:brightness(1.08)} .btn.good{background:color-mix(in srgb,var(--good) 30%,var(--panel));border-color:color-mix(in srgb,var(--good) 55%,var(--panel))}
.btn.bad{background:color-mix(in srgb,var(--bad) 30%,var(--panel));border-color:color-mix(in srgb,var(--bad) 55%,var(--panel))} .btn.ghost{background:transparent}
select,input,textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:none}
select:focus,input:focus,textarea:focus{border-color:color-mix(in srgb,var(--accent) 65%,var(--panel))}
textarea{width:100%;resize:vertical}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px}
.chip.c{border-color:color-mix(in srgb,var(--claude) 45%,var(--panel))} .chip.g{border-color:color-mix(in srgb,var(--gpt) 45%,var(--panel))}

/* layout */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 6px var(--aside-w,390px);min-height:0}
#chatcol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#taskbar{display:flex;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--bar)}
#taskbar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#banners .b{padding:8px 16px;border-bottom:1px solid var(--line)}
.b.err{background:color-mix(in srgb,var(--bad) 22%,var(--panel));color:color-mix(in srgb,var(--bad) 35%,var(--text))} .b.warn{background:color-mix(in srgb,var(--warn) 22%,var(--panel));color:color-mix(in srgb,var(--warn) 45%,var(--text))}
#chat{flex:1;overflow-y:auto;padding:6px 18px 12px}
.msg{display:flex;gap:10px;margin:12px 0;max-width:860px}
.msg.human{flex-direction:row-reverse;margin-left:auto}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:var(--input)}
.claude .avatar{background:var(--claude)} .chatgpt .avatar{background:var(--gpt)} .human .avatar{background:var(--human)} .msg.system .avatar{visibility:hidden}
.bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;min-width:90px;max-width:100%}
.claude .bubble{border-color:color-mix(in srgb,var(--claude) 35%,var(--panel))} .chatgpt .bubble{border-color:color-mix(in srgb,var(--gpt) 35%,var(--panel))} .human .bubble{border-color:color-mix(in srgb,var(--accent) 40%,var(--panel));background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:2px}
.meta b{color:var(--text)}
.tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:11px}
.text{word-wrap:anywhere}
.text pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:340px;margin:6px 0}
code{font-family:ui-monospace,Consolas,"Cascadia Mono",monospace;font-size:12.5px}
.text code{background:var(--code);padding:1px 5px;border-radius:5px}
.text pre code{padding:0;background:none}
.typing{display:flex;gap:10px;align-items:center;color:var(--muted);margin:10px 0}
.typing .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:blink 1.2s infinite}
.typing .dots span:nth-child(2){animation-delay:.2s} .typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.empty{margin:80px auto;text-align:center;max-width:420px;color:var(--muted)}
.empty h2{color:var(--text);margin:0 0 6px}

#approvals .appr-warn{margin:6px 0;padding:6px 9px;border-radius:calc(var(--r) - 4px);background:color-mix(in srgb,var(--bad) 18%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 45%,var(--panel));font-size:13px}
.cx-env{gap:8px;margin:4px 0;flex-wrap:nowrap}.cx-env code{min-width:40%;font-size:12px;word-break:break-all}.cx-env input{flex:1}
.cx-toollist{max-height:220px;overflow:auto;margin:6px 0;border:1px solid var(--line);border-radius:calc(var(--r) - 4px);padding:4px 8px}
.cx-tool{gap:8px;flex-wrap:nowrap;padding:2px 0}.cx-tool code{font-size:12px;white-space:nowrap}.cx-tool .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-pv code{word-break:break-all}.cx-pv .b{margin:6px 0;padding:6px 10px;border-radius:calc(var(--r) - 4px)}.chip.warnchip{background:color-mix(in srgb,var(--warn) 25%,var(--panel));border-color:var(--warn)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg .btn.on{background:var(--accent);color:var(--onaccent,#fff);border-color:var(--accent)}
.card.flash{animation:flash 1.6s}@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:none}}
.chg-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}.chg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:calc(var(--r) - 4px);padding:6px 8px;background:var(--panel2)}
.chg-main{flex:1;min-width:0}.chg-path{cursor:pointer;font-family:var(--mono,ui-monospace,monospace);font-size:13px;word-break:break-all}.chg-path:hover{text-decoration:underline}.chg.undone{opacity:.55}
.chg-note{color:var(--warn)}.chip.st-good{border-color:var(--good);color:var(--good)}.chip.st-warn{border-color:var(--warn);color:var(--warn)}.chip.st-bad{border-color:var(--bad);color:var(--bad)}.chip.st-muted{opacity:.7}
#cmdpop{position:absolute;left:14px;right:14px;bottom:calc(100% + 4px);background:var(--raised,var(--panel2));border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.35);padding:4px;z-index:20;display:flex;flex-direction:column}
#cmdpop[hidden]{display:none}#cmdpop .cmdlist{max-height:300px;overflow:auto}
#cmdpop .cmd{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:calc(var(--r) - 4px);cursor:pointer}#cmdpop .cmd.on,#cmdpop .cmd:hover{background:color-mix(in srgb,var(--accent) 22%,transparent)}
#cmdpop code{white-space:nowrap;font-size:13px}#cmdpop .cmdhint{padding:5px 8px 3px;border-top:1px solid var(--line);margin-top:2px}#cmdpop .muted{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag.to-claude{background:color-mix(in srgb,var(--claude) 25%,transparent)}.tag.to-chatgpt{background:color-mix(in srgb,var(--gpt) 25%,transparent)}
pre.cmdshow{white-space:pre-wrap;max-height:65vh;overflow:auto;font-size:13px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px}
.skchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chip.sk{cursor:pointer;font-size:11px;padding:1px 8px}.chip.sk:hover{border-color:var(--bad)}
.btn.on{background:color-mix(in srgb,var(--accent) 28%,var(--panel2));border-color:var(--accent)}
.msel{position:relative}.msel-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--input);border:1px solid var(--line);border-radius:calc(var(--r) - 2px);padding:8px 10px;color:var(--text);font:inherit;cursor:pointer}
.msel-btn:focus-visible{outline:2px solid var(--accent)}.msel-panel{margin-top:4px;background:var(--raised,var(--panel2));border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.4);padding:6px}
.msel-panel[hidden]{display:none}.msel-search{width:100%;margin-bottom:4px}.msel-list{max-height:240px;overflow:auto}.field label.msel-row,.msel-row{display:flex;gap:10px;align-items:flex-start;padding:6px;border-radius:calc(var(--r) - 4px);cursor:pointer;font-size:inherit;color:var(--text);margin:0}
.field .msel-row input[type=checkbox]{width:auto;flex:0 0 auto;margin-top:3px}.msel-row .grow{min-width:0}
.msel-row.on,.msel-row:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}.msel-foot{padding:4px 6px 0;border-top:1px solid var(--line);margin-top:4px}.msel-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
pre.diff .add{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}pre.diff .del{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}pre.diff .hunk{color:var(--muted)}
#setpage{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}#setpage[hidden]{display:none}
.sp-head{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}.sp-head h2{margin:0;font-size:18px}
#sp-search{max-width:280px}.sp-body{flex:1;display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}
#sp-nav{border-right:1px solid var(--line);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.spn{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:calc(var(--r) - 2px);font:inherit;cursor:pointer}
.spn:hover{background:var(--panel2);color:var(--text)}.spn.on{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--text);font-weight:600}.spn.dim{opacity:.35}.spn .ico{width:20px;text-align:center}
#sp-content{overflow:auto;padding:22px 28px 60px}.sp-sec{max-width:820px}.sp-sec>h2{margin:0 0 4px;font-size:20px}.sp-intro{margin:0 0 14px}
.sp-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}.sp-card>h3:first-child{margin-top:0}
#csback{position:fixed;inset:0;z-index:34;background:color-mix(in srgb,#000 40%,transparent)}#csback[hidden]{display:none}
#chatset{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);z-index:35;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 40px color-mix(in srgb,#000 35%,transparent);display:flex;flex-direction:column}
#chatset[hidden]{display:none}.cs-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}.cs-head h2{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cs-body{flex:1;overflow:auto;padding:4px 16px 40px}.cs-sec{padding:12px 0;border-bottom:1px solid var(--line)}.cs-sec:last-child{border-bottom:0}.cs-sec h3{margin:4px 0 2px}.cs-sub{margin-bottom:8px}
.cs-skill{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}.cs-skill:last-child{border-bottom:0}
#hdr .chatname{background:none;border:1px solid transparent;border-radius:calc(var(--r) - 4px);color:var(--text);font:inherit;font-weight:600;padding:3px 8px;cursor:pointer}#hdr .chatname:hover{border-color:var(--line);background:var(--panel2)}
#hdr .gear{font-size:17px;padding:4px 9px}
#hdr{container-type:inline-size;container-name:hdr;flex-wrap:nowrap;gap:8px}#hdr *{white-space:nowrap}.hgrp{display:flex;align-items:center;gap:6px;min-width:0}
.hleft{flex:0 1 auto;overflow:hidden}.hctl{flex:none}.hright{flex:0 1 auto;min-width:0}#hdr .grow{flex:1 1 0;min-width:4px}
#hdr .btn .ico{display:inline-block;min-width:1em;text-align:center}#hdr .btn .lbl{margin-left:5px}#hdr .chatname{display:flex;align-items:center;min-width:40px;max-width:260px;flex:0 1 auto}#hdr .chatname .cn{overflow:hidden;text-overflow:ellipsis}
#hdr select{max-width:170px;min-width:64px;flex:0 1 auto;text-overflow:ellipsis}.pill .turns{opacity:.8}#hdr .logo{flex:none}
.chip.models{display:flex;gap:10px;align-items:center;max-width:300px;overflow:hidden;flex:0 1 auto}.mdl{display:flex;align-items:center;gap:5px;min-width:0}.mdl i{width:8px;height:8px;border-radius:50%;flex:none}
.mdl.c i{background:var(--claude)}.mdl.g i{background:var(--gpt)}.mname{overflow:hidden;text-overflow:ellipsis;max-width:120px}
@container hdr (max-width: 1320px){ #btn-halt .lbl{display:none} .mname{max-width:90px} #hdr .chatname{max-width:200px} }
@container hdr (max-width: 1180px){ #btn-step .lbl, #btn-stop .lbl, #btn-pause .lbl, #btn-resume .lbl, #btn-more .lbl{display:none} .logo .lbl{display:none} #hdr select{max-width:130px} .mname{max-width:64px} }
@container hdr (max-width: 1000px){ #hdr .pill .lbl, .mname{display:none} .chip.models{gap:6px;padding:4px 8px} #hdr .chatname{max-width:150px} #btn-new .lbl{display:none} #hdr .badge{display:none} #hdr select{max-width:112px} }
@container hdr (max-width: 820px){ #hdr select{max-width:88px;font-size:12px;padding-left:4px;padding-right:2px} #hdr .chatname{max-width:110px} #hdr .pill .turns{display:none} #hdr .gear{padding:4px 6px} }
@media (max-width:760px){.sp-body{grid-template-columns:1fr}#sp-nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.spn{white-space:nowrap}#sp-content{padding:14px}.sp-head{flex-wrap:wrap}#sp-search{max-width:none;flex:1}}
.codeblock{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--code);position:relative;overflow:hidden}
.cb-head{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--code) 70%,var(--panel2))}
.cb-lang{font-family:var(--mono,ui-monospace,monospace);font-size:12px;font-weight:600;color:var(--text);text-transform:lowercase}
.cb-btn{background:none;border:1px solid transparent;border-radius:6px;color:var(--muted);font:inherit;font-size:12px;padding:2px 8px;cursor:pointer}.cb-btn:hover,.cb-btn.on{border-color:var(--line);color:var(--text)}
.text .codeblock pre.cb-pre{margin:0;border:0;border-radius:0;background:none;max-height:none;overflow-x:auto;white-space:pre;tab-size:4;padding:10px 12px;line-height:1.5}
.text .codeblock pre.cb-pre.wrap{white-space:pre-wrap;word-break:break-word}.text .codeblock pre.cb-pre.folded{max-height:calc(24 * 1.5em + 20px);overflow-y:hidden}
.cb-fade{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,var(--code));cursor:pointer}.codeblock:has(.cb-pre:not(.folded)) .cb-fade{display:none}
#asplit{cursor:col-resize;background:transparent;position:relative;z-index:2;outline:none}#asplit::after{content:"";position:absolute;inset:0 2px;background:var(--line);transition:background .15s}
#asplit:hover::after,#asplit:focus-visible::after,body.resizing #asplit::after{background:var(--accent)}body.resizing{cursor:col-resize;user-select:none}
#tabbar{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}#tabbar #tabs{flex:1;border-bottom:0}#aside-hide{border:0;border-radius:0;padding:0 12px;color:var(--muted)}#aside-hide:hover{color:var(--text)}
#aside-show{font-size:12px;padding:3px 10px;margin-left:6px}#aside-show[hidden]{display:none}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;margin:6px 0;background:var(--panel2)}.tcard.doing{border-left:3px solid var(--accent)}.tcard.blocked{border-left:3px solid var(--bad)}.tcard.done{opacity:.6}
.tcard.editor{display:flex;flex-direction:column;gap:8px}.tcard.editor .row>*{flex:1}.tc-top{display:flex;align-items:center;gap:8px}.tc-title{flex:1;font-weight:500;min-width:0;overflow-wrap:anywhere}
.tc-top .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 2px;visibility:hidden}.tcard:hover .x,.tcard:focus-within .x{visibility:visible}
.who-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--line);color:var(--text)}.who-dot.claude{background:var(--claude);color:var(--input)}.who-dot.chatgpt{background:var(--gpt);color:var(--input)}.who-dot.human{background:var(--human);color:var(--input)}
.tc-flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.tflag{font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}.tflag.warn{border-color:var(--warn);color:var(--warn)}.tflag.bad{border-color:var(--bad);color:var(--bad)}.tflag.muted{color:var(--muted)}
.tc-ctl{display:flex;gap:6px;margin-top:6px}select.mini{font-size:12px;padding:2px 6px;max-width:130px}.tc-note{margin-top:6px}
.empty-hint{text-align:center;padding:26px 14px;color:var(--text)}.empty-hint .eh-ico{font-size:28px;opacity:.7;margin-bottom:4px}.empty-hint p{margin:6px auto 0;max-width:280px}.small-hint{padding:14px}
button.chg-path{background:none;border:0;padding:0;color:var(--text);text-align:left}button.chg-path:hover{color:var(--accent)}
.diffbox pre{max-height:62vh!important}.appr pre.folded,.appr pre.diff.folded{max-height:calc(6 * 1.45em + 16px);overflow:hidden}#board-add{margin-bottom:10px}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 30%,transparent)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}button:focus:not(:focus-visible){outline:none}
.tcard:focus-visible,.chg-path:focus-visible,.spn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.deplink{background:none;border:0;padding:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}.tcard{cursor:pointer}.tcard:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tc-meta{margin-top:5px}.td-notes{max-height:180px;overflow:auto;margin-bottom:6px;display:flex;flex-direction:column;gap:4px}
.b.limit{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.b.limit .grow{flex:1;min-width:200px}
#approvals .appr{margin:8px 14px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--panel));background:color-mix(in srgb,var(--warn) 15%,var(--panel));border-radius:var(--r);padding:10px 12px}
.appr-h{margin-bottom:6px}
.appr pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:220px;overflow:auto;margin:0 0 8px;white-space:pre-wrap;word-break:break-word;font-size:12.5px}
#composer{position:relative;display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel);align-items:flex-end}
#composer textarea{min-height:66px;max-height:min(280px,38vh);resize:none;line-height:1.45;padding:10px 12px;flex:1;min-width:0}#composer{align-items:stretch}#composer .btn{align-self:flex-end}#chatcol{container-type:inline-size;container-name:chatcol}

    const dir = h("input", {type: "file", webkitdirectory: true, multiple: true, hidden: true, on: {change: async e => { const fl = [...e.target.files]; if (!fl.length) return;
      if (fl.reduce((a, f) => a + f.size, 0) > 20e6) { put(pv, h("div", {class: "b err"}, "That folder is too big (20 MB max).")); return; }
      const files = await Promise.all(fl.map(f => new Promise(res => { const rd = new FileReader(); rd.onload = () => res({path: f.webkitRelativePath || f.name, b64: rd.result.split(",")[1] || ""}); rd.readAsDataURL(f); })));
      try { show(await api("/api/skills/folder", {files, source: "uploaded folder"})); } catch (er) { put(pv, h("div", {class: "b err"}, er.message)); } e.target.value = ""; }}});
    put(body, h("div", {class: "muted small"}, "A skill is a folder with a SKILL.md at the top (plus any files it uses). You'll see what's in it before anything is added."),
      h("div", {class: "row", style: "margin:8px 0"}, h("button", {class: "btn primary", on: {click: () => zip.click()}}, "Upload a .zip"), h("button", {class: "btn", on: {click: () => dir.click()}}, "Pick a folder"), zip, dir), pv);
  };
  const draw = () => { put(tabs, [["found", "From Claude Code / Codex"], ["upload", "Upload a .zip or folder"]].map(([k, l]) => h("button", {class: "btn" + (tab === k ? " on" : ""), on: {click: () => { tab = k; draw(); }}}, l)));
    tab === "found" ? drawFound() : drawUpload(); };
  draw();
  showModal(h("div", {class: "sheet", style: "max-width:680px"}, h("h2", {}, "Add skills"), tabs, body,
    h("div", {class: "row", style: "justify-content:flex-end;margin-top:6px"}, h("button", {class: "btn", on: {click: () => { openSkillEditor(null); }}}, "Write one instead"), h("button", {class: "btn", on: {click: closeModal}}, "Close"))));
}
async function openSkillEditor(k) {
  let body = "";
  if (k) { try { const md = (await api("/api/skills/read?id=" + encodeURIComponent(k.id))).text; body = md.replace(/^\ufeff?---\s*\n[\s\S]*?\n---\s*\n?/, "").trim(); } catch (e) { toast(e.message, true); return; } }
  const name = h("input", {id: "ske-name", value: k ? k.name : "", placeholder: "Python style"});
  const desc = h("input", {id: "ske-desc", value: k ? k.description : "", placeholder: "Use when writing Python: type hints, small functions, a test for every fix"});
  const ta = h("textarea", {id: "ske-body", rows: 14, spellcheck: false, placeholder: "# Python style\n\n- Type hints on every function\n- Keep functions short; one job each\n- Add a test for every bug you fix\n- ..."}, body);
  const save = async () => { try { const d = await api("/api/skills/write", {id: k ? k.id : undefined, name: name.value, description: desc.value, body: ta.value}); SK.list = d.skills; closeModal(); loadSkills(); toast("Saved " + name.value); } catch (e) { toast(e.message, true); } };
  showModal(h("div", {class: "sheet", style: "max-width:720px"}, h("h2", {}, k ? "Edit " + k.name : "Write a skill"),
    h("div", {class: "field"}, h("label", {}, "Name"), name),
    h("div", {class: "field"}, h("label", {}, "When to use it  ", h("span", {class: "muted"}, "one line; it's how the AIs know when it fits")), desc),
    h("div", {class: "field"}, h("label", {}, "Instructions (Markdown)"), ta),
    k && k.files > 1 ? h("div", {class: "muted small"}, `Its other ${k.files - 1} file(s) are kept.`) : null,
    h("div", {class: "row", style: "justify-content:flex-end;margin-top:8px"}, h("button", {class: "btn", on: {click: closeModal}}, "Cancel"), h("button", {class: "btn primary", id: "ske-save", on: {click: save}}, "Save"))));
}
function buildYourCommands() { ui.ycNode = h("div", {id: "yourcmds"}); renderYourCommands(); }
function renderYourCommands() {
  const edit = c => {
    const name = h("input", {id: "yc-name", placeholder: "fix", value: c ? c.name : ""});
    const tpl = h("textarea", {id: "yc-tpl", rows: 4, placeholder: "Find and fix the bug in {file}. Explain what was wrong before changing anything."}, c ? c.template : "");
    const desc = h("input", {id: "yc-desc", placeholder: "optional: shown in the / list", value: c ? c.description : ""});
    const prev = h("div", {class: "muted small"});
    const showPrev = () => { const b = [...new Set((tpl.value.match(/\{([A-Za-z_][A-Za-z0-9_ -]{0,30})\}/g) || []))]; prev.textContent = "You'll type: /" + (name.value || "name") + (b.length ? " " + b.join(" ") : "") + (b.length > 1 ? "   (one word each, \"quotes\" for a phrase; the last one takes the rest)" : ""); };
    name.addEventListener("input", showPrev); tpl.addEventListener("input", showPrev); showPrev();
    const save = async () => { try { Object.assign(CMD, await api("/api/commands", {name: name.value, template: tpl.value, description: desc.value, old_name: c ? c.name : undefined})); closeModal(); renderYourCommands(); toast("Saved /" + name.value.replace(/^\//, "")); } catch (e) { toast(e.message, true); } };
    showModal(h("div", {class: "sheet", style: "max-width:560px"}, h("h2", {}, c ? "Edit /" + c.name : "New command"),
      h("div", {class: "field"}, h("label", {}, "Name (what you type after /)"), name),
      h("div", {class: "field"}, h("label", {}, "What it sends  ", h("span", {class: "muted"}, "use {blanks} for the parts you fill in; start with /claude or /gpt to send it to one AI")), tpl),
      h("div", {class: "field"}, h("label", {}, "Description"), desc), prev,
      h("div", {class: "row", style: "justify-content:flex-end;margin-top:8px"}, h("button", {class: "btn", on: {click: closeModal}}, "Cancel"), h("button", {class: "btn primary", id: "yc-save", on: {click: save}}, "Save"))));
  };
  put(ui.ycNode, CMD.custom.length ? CMD.custom.map(c => h("div", {class: "chg"}, h("div", {class: "chg-main"}, h("code", {}, "/" + c.name + [...new Set(c.template.match(/\{[^}]+\}/g) || [])].map(b => " " + b).join("")), h("div", {class: "muted small"}, c.description || c.template.slice(0, 100))),
      h("button", {class: "btn", on: {click: () => edit(c)}}, "Edit"),
      h("button", {class: "btn bad", on: {click: async () => { if (!confirm("Delete /" + c.name + "?")) return; try { Object.assign(CMD, await api("/api/commands", {delete: c.name})); renderYourCommands(); } catch (e) { toast(e.message, true); } }}}, "Delete")))
    : h("div", {class: "muted small"}, "None yet. Make shortcuts for things you ask a lot, like /fix {file} or /review."),
    h("div", {class: "row", style: "margin-top:6px"}, h("button", {class: "btn primary", id: "yc-new", on: {click: () => edit(null)}}, "+ New command"), h("span", {class: "muted small"}, "Type / in the message box to see every command. Only you can run them; the AIs can't.")));
}

/* ---------- init ---------- */
function init() {
  loadAppearance();
  $("#btn-newchat").addEventListener("click", () => openNewChat());
  $("#btn-newproj").addEventListener("click", openNewProject);
  $("#chat-search").addEventListener("input", renderChats);
  $("#tabs").replaceChildren(...TABS.map(([id, l]) => h("button", {id: "tab-" + id, role: "tab", class: id === ui.tab ? "on" : "", on: {click: () => openTab(id)}}, l)));
  $("#tabs").addEventListener("keydown", e => {  // arrow keys move between the side panel's tabs
    const ids = TABS.map(t => t[0]), i = ids.indexOf(ui.tab);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const n = ids[(i + (e.key === "ArrowRight" ? 1 : ids.length - 1)) % ids.length]; openTab(n); $("#tab-" + n).focus(); e.preventDefault(); }
  });
  buildBoardAdd(); buildSettings(); fillDatalists(); loadCommands(); setupAside();
  const say = $("#say"), send = async (now) => {
    const t = say.value.trim(), ids = attach.list.filter(a => a.id).map(a => a.id);
    if (attach.list.some(a => a.up)) { toast("Still uploading the image, one second.", true); return; }
    if (!t && !ids.length) return;
    const keep = attach.list; say.value = ""; say.style.height = ""; attach.list = []; renderAttach();
    cmdPop.hide();
    try { const r = await api("/api/say", {text: t, images: ids, now: now === true});
      if (r.show) showModal(h("div", {class: "sheet", style: "max-width:720px"}, h("pre", {class: "cmdshow"}, r.show), h("div", {class: "row", style: "justify-content:flex-end"}, h("button", {class: "btn", on: {click: closeModal}}, "Close"))));
      if (r.chat) { resetChatView(); await loadChats(true); }
      if (r.note && r.note !== "Sent.") toast(r.note); await tick(true); }
    catch (e) { toast(e.message, true); say.value = t; attach.list = keep; renderAttach(); }
  };
  const cmdPop = commandPopup(say);
  $("#attachbtn").addEventListener("click", () => $("#attachfile").click());
  $("#attachfile").addEventListener("change", e => { attachFiles([...e.target.files]); e.target.value = ""; });
  say.addEventListener("paste", e => {
    const files = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.kind === "file" && i.type.startsWith("image/")).map(i => i.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); attachFiles(files); }
  });
  const col = $("#chatcol");
  col.addEventListener("dragover", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { e.preventDefault(); col.classList.add("drop"); } });
  col.addEventListener("dragleave", e => { if (e.target === col) col.classList.remove("drop"); });
  col.addEventListener("drop", e => { col.classList.remove("drop"); if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); attachFiles([...e.dataTransfer.files]); } });
  say.addEventListener("keydown", e => { if (cmdPop.key(e)) return; if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(e.ctrlKey || e.metaKey); } });
  say.addEventListener("input", () => { say.style.height = "auto"; say.style.height = Math.min(say.scrollHeight, 280, Math.round(innerHeight * 0.38)) + "px"; cmdPop.update(); });
  say.addEventListener("blur", () => setTimeout(() => cmdPop.hide(), 150));
  $("#sendbtn").addEventListener("click", () => send(false));
  $("#sendnowbtn").addEventListener("click", () => send(true));
  $("#edittask").addEventListener("click", editTask);
  $("#modal").addEventListener("mousedown", e => { if (e.target.id === "modal") closeModal(); });
  $("#sp-close").addEventListener("click", closeSettings);
  $("#sp-search").addEventListener("input", e => filterSettings(e.target.value));
  $("#cs-close").addEventListener("click", closeChatSettings);
  $("#csback").addEventListener("mousedown", closeChatSettings);
  for (const b of $("#act-seg").children) b.addEventListener("click", () => setActSeg(b.dataset.v));
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if ($("#modal").classList.contains("on")) return closeModal();
    if (!$("#chatset").hidden) return closeChatSettings();
    if (!$("#setpage").hidden) return closeSettings();
  });
  tick();
}
init();
</script>
